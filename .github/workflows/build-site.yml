name: Build site

# Reusable build. The site used to be built twice for each event: once for the
# preview/deployment and once for W3C validation. The build now runs in one
# place, and its artifacts are shared between jobs.
#
# This workflow is also called from pull_request_target, where code from a
# fork runs (npm ci, *.11tydata.js). Secrets are therefore passed explicitly
# by name; untrusted builds receive none. Do not use `secrets: inherit` in
# calls, as that would expose all secrets, including DEPLOY_KEY, to the fork.
on:
  workflow_call:
    inputs:
      ref:
        description: Platform commit to build. If empty, use the commit that triggered the workflow.
        type: string
        required: false
        default: ''
      allow-unsafe-checkout:
        description: Allow checking out code from a fork. Required when called from pull_request_target.
        type: boolean
        required: false
        default: false
      content-repository:
        description: GitHub repository containing the content to build.
        type: string
        required: false
        default: harikumarstudio/wiki-content
      cache-prefix:
        description: >-
          Prefix for the npm cache key. Untrusted builds must use their own
          prefix; otherwise, a fork could poison the production deployment cache.
        type: string
        required: true
    secrets:
      content-token:
        description: Token with read access to a private content repository.
        required: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PATH_TO_CONTENT: ./content
      SECTIONS: cpp, houdini, python, ai, unreal
      CONTENT_REP_FOLDERS: cpp, houdini, python, ai, unreal, people, pages, settings
    steps:
      - name: Check out platform
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: ${{ inputs.allow-unsafe-checkout }}
          persist-credentials: false
      - name: Check out content
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.content-repository }}
          token: ${{ secrets.content-token || github.token }}
          path: content
          fetch-depth: 0
          persist-credentials: false
      - name: Check out cache
        uses: actions/checkout@v6
        with:
          repository: doka-guide/cache
          path: cache
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # Without restore-keys, an untrusted build cannot read or overwrite the
      # trusted cache. cache-prefix keeps the caches separate.
      - name: Cache npm modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ inputs.cache-prefix }}-${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Copy cache file
        run: cp ./cache/issues.json ./.issues.json
      - name: Verify content folders
        run: |
          set -eu
          IFS=', ' read -r -a CONTENT_FOLDERS <<< "$CONTENT_REP_FOLDERS"
          for folder in "${CONTENT_FOLDERS[@]}"; do
            test -d "content/$folder" || {
              echo "::error::Content folder is missing: content/$folder"
              exit 1
            }
          done
      - name: Build site
        run: |
          set -eu
          cp .env.example .env
          npm run build
      # An empty dist would reach rsync --delete and erase the site, so check
      # the build before packaging or uploading it.
      - name: Verify build output
        run: |
          set -eu
          test -f dist/index.html || { echo "dist is empty; the build produced no output"; exit 1; }
      # The full artifact is used for deployment, but the validator only needs
      # HTML pages, not the nearly 500 MB of images. This keeps its artifact
      # small while deployment still gets the complete site.
      # Use one tar archive instead of tens of thousands of files; otherwise
      # uploading would take longer than building the site.
      - name: Package site
        run: tar --create --file site.tar --directory dist .
      # The manifest lets the receiving job verify that the archive arrived
      # intact. Without it, a truncated archive could still contain index.html
      # and be sent to rsync --delete, removing missing files from production.
      - name: Create artifact manifest
        run: |
          set -eu
          {
            printf 'sha256=%s\n' "$(sha256sum site.tar | cut -d' ' -f1)"
            printf 'files=%s\n' "$(find dist -type f | wc -l | tr -d ' ')"
            printf 'html=%s\n' "$(find dist -type f -name '*.html' | wc -l | tr -d ' ')"
          } > site-manifest.txt
          cat site-manifest.txt
      - name: Package HTML pages
        run: |
          set -eu
          cd dist
          find . -name '*.html' -print0 \
            | tar --create --file ../site-html.tar --null --files-from -
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: |
            site.tar
            site-manifest.txt
          retention-days: 1
          if-no-files-found: error
          # Of 494 MB, about 340 MB are already-compressed images, while 86 MB
          # of HTML compress to 5.7 times smaller. Level 1 gets most of the
          # benefit without spending CPU on the rest.
          compression-level: 1
      - name: Upload HTML artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-html
          path: site-html.tar
          retention-days: 1
          if-no-files-found: error
