name: PR Preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  DEPLOY_DOMAIN: https://platform-${{ github.event.pull_request.number }}.dev.doka.guide

jobs:
  # Post a build-start message. No fork code runs here, so the workflow can write to the pull request.
  start:
    name: Post build-start message
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          MESSAGE: "Building and publishing the preview... [Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        with:
          script: |
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const marker = `<!-- doka-preview-${issue_number} -->`
            const body = `${marker}\n${process.env.MESSAGE}`
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const existing = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' && (comment.body || '').includes(marker),
            )
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  # Build code from the fork. The reusable workflow has no secrets, and
  # GITHUB_TOKEN is read-only, so running fork code (npm ci, *.11tydata.js)
  # cannot access credentials. A separate cache prefix prevents the fork from
  # overwriting the production deployment cache.
  build:
    name: Build preview
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/build-site.yml
    # A reusable workflow cannot request more permissions than its caller
    # grants. The workflow-level permissions are empty, so grant read access here.
    permissions:
      contents: read
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      allow-unsafe-checkout: true
      cache-prefix: pr-preview

  # Validate the built pages. This job needs no secrets and uses the same
  # artifact as deployment, so the site is not built a second time.
  validate:
    name: Validate markup
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Only package.json and the validator dependencies are needed; the site
      # arrives as an artifact. No fork code runs here, so use the base branch.
      - name: Check out platform
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          architecture: x64
      - name: Install dependencies
        run: npm ci
      - name: Download pages
        uses: actions/download-artifact@v4
        with:
          name: site-html
      # The archive was built from fork code. Remove symlinks, or an archive
      # entry could point outside dist. Normal builds do not create symlinks.
      - name: Extract pages
        run: |
          set -eu
          mkdir -p dist
          tar --extract --file site-html.tar --directory dist \
            --no-same-owner --no-same-permissions
          find dist -type l -delete
      - name: Validate
        run: npm run lint:html

  # Deploy the preview. DEPLOY_KEY is available here, but no fork code runs—
  # only the built static files are used.
  deploy:
    name: Deploy preview
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    env:
      PREVIEW_PATH: /web/sites/dev.doka.guide/platform/${{ github.event.pull_request.number }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
      # The manifest protects against a truncated archive: rsync --delete runs
      # next, and an incomplete artifact would remove missing preview files.
      # Parse with grep, not source: the manifest was produced by fork code and is data.
      - name: Verify artifact
        run: |
          set -eu
          test -f site-manifest.txt || { echo "Artifact manifest is missing"; exit 1; }
          EXPECTED_SHA="$(grep '^sha256=' site-manifest.txt | cut -d= -f2)"
          ACTUAL_SHA="$(sha256sum site.tar | cut -d' ' -f1)"
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "Archive was corrupted in transit: expected $EXPECTED_SHA, got $ACTUAL_SHA"
            exit 1
          fi
          echo "EXPECTED_FILES=$(grep '^files=' site-manifest.txt | cut -d= -f2)" >> "$GITHUB_ENV"
      # The archive was built from fork code. Extract it and remove symlinks
      # before writing the key, or an archive entry could point to
      # $HOME/.ssh/doka_deploy and expose the key in the public preview.
      # Normal builds do not create symlinks in dist.
      - name: Extract artifact
        run: |
          set -eu
          PREVIEW_DIR="$(mktemp -d "$RUNNER_TEMP/preview.XXXXXX")"
          tar --extract --file site.tar --directory "$PREVIEW_DIR" --no-same-owner --no-same-permissions
          ACTUAL_FILES="$(find "$PREVIEW_DIR" -type f | wc -l | tr -d ' ')"
          if [ "$ACTUAL_FILES" -ne "$EXPECTED_FILES" ]; then
            echo "Extracted $ACTUAL_FILES files instead of $EXPECTED_FILES"
            exit 1
          fi
          # Remove symlinks after verifying the file count: removing them does
          # not change the number of regular files, but must happen before writing the key.
          find "$PREVIEW_DIR" -type l -delete
          test -f "$PREVIEW_DIR/index.html" || { echo "Artifact does not contain index.html"; exit 1; }
          echo "PREVIEW_DIR=$PREVIEW_DIR" >> "$GITHUB_ENV"
      - name: Set up deployment key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/doka_deploy"
          chmod 600 "$HOME/.ssh/doka_deploy"
      - name: Deploy preview
        run: |
          set -eu
          SSH_COMMAND="ssh -i $HOME/.ssh/doka_deploy -o StrictHostKeyChecking=no"
          $SSH_COMMAND deploy@dev.doka.guide mkdir -p "$PREVIEW_PATH"
          rsync -e "$SSH_COMMAND" --archive --compress --delete-after --safe-links \
            "$PREVIEW_DIR/" "deploy@dev.doka.guide:$PREVIEW_PATH"
          echo "Preview available at $DEPLOY_DOMAIN"

  # Post the final comment. Without always(), a failed build would leave the
  # pull request stuck with the "Building..." message.
  report:
    name: Report on pull request
    needs: [start, build, validate, deploy]
    if: ${{ always() && !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          IS_PUBLISHED: ${{ needs.deploy.result == 'success' }}
          SUCCESS_MESSAGE: '<a href="${{ env.DEPLOY_DOMAIN }}">Content preview</a> for ${{ github.event.pull_request.head.sha }} has been published.'
          FAILURE_MESSAGE: "Content preview for ${{ github.event.pull_request.head.sha }} was not published. Build or deployment failed. [Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        with:
          script: |
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const marker = `<!-- doka-preview-${issue_number} -->`
            const isPublished = process.env.IS_PUBLISHED === 'true'
            const message = isPublished ? process.env.SUCCESS_MESSAGE : process.env.FAILURE_MESSAGE
            const body = `${marker}\n${message}`
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const existing = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' && (comment.body || '').includes(marker),
            )
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
            if (!isPublished) {
              core.setFailed('Preview was not published')
            }
