name: Docker Deploy

on:
  push:
    branches:
      - main

permissions: {}

env:
  IMAGE: dokaguide/platform

jobs:
  # Both architectures used to build in one job through QEMU. Node 24 under
  # arm64 emulation intermittently failed during npm ci with "qemu: uncaught
  # target signal 4 (Illegal instruction)," depending on the JIT code path.
  # Each architecture now builds on its own native runner, without emulation.
  build:
    name: Build image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out platform
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Each build pushes an untagged image and returns its digest. The tag is
      # added once in the merge job after both architectures are ready.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Save digest
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: Create slash-free artifact name
        run: echo "ARTIFACT=digest-${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  # The dokaguide/platform:latest tag is assigned to the manifest containing
  # both images. This separate job prevents the tag from moving to one
  # architecture before the other is ready.
  merge:
    name: Create manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish manifest
        run: |
          set -eu
          cd digests
          # shellcheck disable=SC2046
          docker buildx imagetools create --tag "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect published image
        run: docker buildx imagetools inspect "$IMAGE:latest"
