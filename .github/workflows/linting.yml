name: Linting

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out platform
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      # Steps do not stop one another, so all three reports are available even
      # if one linter fails.
      # editorconfig-checker downloads its binary through the GitHub API.
      # Without a token, requests are unauthenticated and share the runner IP's
      # rate limit, causing intermittent "API rate limit exceeded" errors.
      - name: Check editorconfig
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run editorconfig
      - name: Lint CSS
        if: ${{ !cancelled() }}
        run: npm run lint:css
      - name: Lint JavaScript
        if: ${{ !cancelled() }}
        run: npm run lint:js
