name: Product Deploy

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  # The build uses a reusable workflow. Previously, every push to main built
  # the site twice: here and in a separate W3C validation job.
  build:
    name: Build site
    uses: ./.github/workflows/build-site.yml
    # A reusable workflow cannot request more permissions than its caller
    # grants. The workflow-level permissions are empty, so grant read access here.
    permissions:
      contents: read
    with:
      cache-prefix: product

  # Validate the markup. The built pages are passed in as an artifact, so this
  # job does not rebuild the site or need content or secrets.
  validate:
    name: Validate markup
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out platform
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'
          architecture: x64
      - name: Install dependencies
        run: npm ci
      - name: Download pages
        uses: actions/download-artifact@v8
        with:
          name: site-html
      - name: Extract pages
        run: |
          set -eu
          mkdir -p dist
          tar --extract --file site-html.tar --directory dist \
            --no-same-owner --no-same-permissions
      - name: Validate
        run: npm run lint:html

  # Production deployment intentionally depends on the build, not validation.
  # Before the build was extracted, these were independent workflows, so
  # invalid markup did not stop a deployment. Adding a validation gate should
  # be a deliberate decision, not a side effect of moving to artifacts.
  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: site-dist
      # rsync --delete runs next, so an incomplete artifact is more dangerous
      # than a failed deployment: it would remove missing files instead of
      # preserving the old version. Verify the checksum and manifest first.
      - name: Verify artifact
        run: |
          set -eu
          test -f site-manifest.txt || { echo "Artifact manifest is missing"; exit 1; }
          # Parse with grep, not source: the manifest is data, not code.
          EXPECTED_SHA="$(grep '^sha256=' site-manifest.txt | cut -d= -f2)"
          ACTUAL_SHA="$(sha256sum site.tar | cut -d' ' -f1)"
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "Archive was corrupted in transit: expected $EXPECTED_SHA, got $ACTUAL_SHA"
            exit 1
          fi
          echo "EXPECTED_FILES=$(grep '^files=' site-manifest.txt | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "EXPECTED_HTML=$(grep '^html=' site-manifest.txt | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: Extract artifact
        run: |
          set -eu
          SITE_DIR="$(mktemp -d "$RUNNER_TEMP/site.XXXXXX")"
          tar --extract --file site.tar --directory "$SITE_DIR" --no-same-owner --no-same-permissions
          test -f "$SITE_DIR/index.html" || { echo "Artifact does not contain index.html"; exit 1; }
          ACTUAL_FILES="$(find "$SITE_DIR" -type f | wc -l | tr -d ' ')"
          if [ "$ACTUAL_FILES" -ne "$EXPECTED_FILES" ]; then
            echo "Extracted $ACTUAL_FILES files instead of $EXPECTED_FILES"
            exit 1
          fi
          # Guard against a build that technically succeeded but produced an
          # almost empty dist. There are about 3,500 pages now, so this leaves
          # plenty of headroom.
          if [ "$EXPECTED_HTML" -lt 5 ]; then
            echo "Suspiciously few pages: $EXPECTED_HTML"
            exit 1
          fi
          echo "SITE_DIR=$SITE_DIR" >> "$GITHUB_ENV"
      # Keep the existing setup sequence: install the key and config, then
      # connect once to add the host to known_hosts.
      - name: Set up deployment key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/wiki_deploy"
          chmod 600 "$HOME/.ssh/wiki_deploy"
          printf '%s\n' "$DEPLOY_CONFIG" > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh -p 65002 -o StrictHostKeyChecking=no u815720699@31.170.164.47
      # --delete-after transfers all files before removing extras. If a
      # transfer is interrupted, nothing is deleted: the server keeps the old
      # version plus whatever arrived from the new one. With the default
      # --delete behavior, an interrupted transfer could remove files early.
      #
      # --max-delete is the final rsync safeguard: if an incomplete artifact
      # somehow passes the manifest check, rsync exits with code 25 rather than
      # cleaning up the production site.
      #
      # Calculate the limit from the build size instead of using a fixed
      # number. A limit of 500 once blocked a normal deployment: old hashed
      # images accumulate on the server, so a valid cleanup can exceed a round
      # number. One fifth of the artifact's file count is about 2,000 of the
      # current 10,500 files—enough for cleanup while still catching an
      # almost-empty build.
      - name: Deploy site
        run: |
          set -eu
          MAX_DELETE=$((EXPECTED_FILES / 5))
          echo "Artifact files: $EXPECTED_FILES; deletion limit: $MAX_DELETE"
          cd "$SITE_DIR"
          rsync -e 'ssh -p 65002' --exclude 'api.json' --exclude 'mail' \
            --archive --progress --compress --delete-after --max-delete="$MAX_DELETE" \
            . u815720699@31.170.164.47:/home/u815720699/domains/archvizwiki.com/public_html/
